<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视原声 - wc4° 音乐仓库</title>
    <!-- 引入全局样式（从 category/ 回到根目录） -->
    <link rel="stylesheet" href="../css/main.css">
    <style>
        /* 针对海量列表的防疲劳 BBS 风格专属样式 */
        .bbs-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* 卡片之间的间距 */
            margin-top: 20px;
        }

        /* 单行极简资源卡片 */
        .bbs-row {
            background-color: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-decoration: none; /* 让整行变成可点击的超链接 */
            color: inherit;
        }
        .bbs-row:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            background-color: rgba(59, 130, 246, 0.02); /* 滑过时有极淡的蓝色科技感 */
        }
        [data-theme="dark"] .bbs-row:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* 左侧边框色彩循环（透过 JS 自动为每列附加 color-X 类别，防止视觉疲劳） */
        .color-0 { border-left: 4px solid #ef4444; } /* 华语红 */
        .color-1 { border-left: 4px solid #3b82f6; } /* 科技蓝 */
        .color-2 { border-left: 4px solid #10b981; } /* 翡翠绿 */
        .color-3 { border-left: 4px solid #f59e0b; } /* 琥珀橙 */
        .color-4 { border-left: 4px solid #8b5cf6; } /* 薰衣草紫 */

        /* 资源标题样式 */
        .resource-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: color 0.2s;
        }
        .bbs-row:hover .resource-title {
            color: #3b82f6; /* 滑过时标题变蓝色，提示可点击 */
        }
        [data-theme="dark"] .bbs-row:hover .resource-title {
            color: #60a5fa;
        }

        /* 点击直接跳转的直达小图标 */
        .direct-go-icon {
            font-size: 16px;
            color: #94a3b8;
            transition: transform 0.2s, color 0.2s;
        }
        .bbs-row:hover .direct-go-icon {
            transform: translateX(4px);
            color: #3b82f6;
        }

        /* 底部滚动加载中提示 */
        .loading-trigger {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            display: none;
        }

        /* 手机端排版优化 */
        @media (max-width: 600px) {
            .bbs-row {
                padding: 14px 16px;
            }
            .resource-title {
                font-size: 13.5px;
            }
            .direct-go-icon {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<header>
    <!-- 返回根目录首页（从 category/ 返回上级目录） -->
    <a href="../index.html" class="back-btn" title="返回仓库">⬅</a>
    <div class="search-wrapper">
        <!-- 海量一键模糊搜索 -->
        <input type="text" id="bbsSearch" class="search-input" placeholder="输入关键字一秒检索...">
    </div>
    <button class="theme-toggle" id="themeBtn">☀️</button>
</header>

<!-- 主体内容 -->
<main class="category-main" style="padding-right: 20px; max-width: 900px;">
    <!-- BBS 极简贴文列表 -->
    <div class="bbs-container" id="bbsList">
        <!-- 数据会在此动态分页加载 -->
    </div>
    <!-- 滚动解锁触发器 -->
    <div class="loading-trigger" id="loadingTrigger">🔍 正在加载更多资源...</div>
</main>

<!-- 全局主题切换脚本 -->
<script src="../js/theme.js"></script>
<!-- 引入独立的影视原声数据库 -->
<script src="../js/ost_data.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 确保 ostDatabase 存在（来自 js/ost_data.js）
        if (typeof ostDatabase === 'undefined') {
            document.getElementById('bbsList').innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">⚠️ 未在 js/ost_data.js 中找到数据库！</div>';
            return;
        }

        // 核心设计 1：将数据倒序排列（逆序，最后添加的显示在最顶部）
        const reversedDatabase = [...ostDatabase].reverse();
        let filteredData = [...reversedDatabase];
        
        // 核心设计 2：滚动分页加载，避免海量数据一次渲染造成手机卡死
        const itemsPerPage = 25; // 每页载入 25 条
        let currentPage = 1;
        
        const searchInput = document.getElementById('bbsSearch');
        const bbsList = document.getElementById('bbsList');
        const loadingTrigger = document.getElementById('loadingTrigger');

        // 渲染单页资源的函数
        function renderBbsPage(page, append = false) {
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);

            if (!append) {
                bbsList.innerHTML = '';
            }

            if (filteredData.length === 0) {
                bbsList.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">没有找到相关资源 🥲</div>';
                loadingTrigger.style.display = 'none';
                return;
            }

            let html = '';
            pageData.forEach((item, index) => {
                // 核心设计 3：利用取余数 (%) 自动为每行分配 color-0 到 color-4，产生精致的彩色循环边框
                const colorClass = `color-${(start + index) % 5}`;

                html += `
                    <a href="${item.link}" class="bbs-row ${colorClass}" target="_blank" title="点击直接开启网盘下载">
                        <div class="resource-title">${escapeHtml(item.title)}</div>
                        <div class="direct-go-icon">🔗</div>
                    </a>
                `;
            });

            if (append) {
                bbsList.insertAdjacentHTML('beforeend', html);
            } else {
                bbsList.innerHTML = html;
            }

            // 判断是否显示滑动加载提示
            if (end < filteredData.length) {
                loadingTrigger.style.display = 'block';
            } else {
                loadingTrigger.style.display = 'none';
            }
        }

        // 简单防 XSS 注入
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 搜索过滤函数
        function searchResources() {
            const keyword = searchInput.value.trim().toLowerCase();
            
            if (keyword === '') {
                filteredData = [...reversedDatabase];
            } else {
                filteredData = reversedDatabase.filter(item => 
                    item.title.toLowerCase().includes(keyword)
                );
            }

            currentPage = 1;
            renderBbsPage(currentPage, false);
        }

        // 滚动加载监听
        window.addEventListener('scroll', () => {
            if (loadingTrigger.style.display === 'none') return;

            const rect = loadingTrigger.getBoundingClientRect();
            // 当底部提示框进入屏幕范围时，自动渲染下一页
            if (rect.top <= window.innerHeight + 100) {
                currentPage++;
                renderBbsPage(currentPage, true);
            }
        });

        // 监听键盘搜索输入
        searchInput.addEventListener('input', searchResources);

        // 初始加载第一页
        renderBbsPage(currentPage, false);
    });
</script>
</body>
</html>
