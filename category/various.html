<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>群星闪耀 - wc4° 音樂倉庫</title>
    <!-- 引入全局樣式（從 category/ 回到根目錄） -->
    <link rel="stylesheet" href="../css/main.css">
    <style>
        /* 針對海量列表的防疲勞 BBS 風格專屬樣式 */
        .bbs-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .bbs-row {
            background-color: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .bbs-row:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            background-color: rgba(59, 130, 246, 0.02);
        }

        [data-theme="dark"] .bbs-row:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .color-0 { border-left: 4px solid #ef4444; }
        .color-1 { border-left: 4px solid #3b82f6; }
        .color-2 { border-left: 4px solid #10b981; }
        .color-3 { border-left: 4px solid #f59e0b; }
        .color-4 { border-left: 4px solid #8b5cf6; }

        .resource-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: color 0.2s;
        }

        .bbs-row:hover .resource-title {
            color: #3b82f6;
        }

        [data-theme="dark"] .bbs-row:hover .resource-title {
            color: #60a5fa;
        }

        .direct-go-icon {
            font-size: 16px;
            color: #94a3b8;
            transition: transform 0.2s, color 0.2s;
        }

        .bbs-row:hover .direct-go-icon {
            transform: translateX(4px);
            color: #3b82f6;
        }

        .loading-trigger {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            display: none;
        }

        @media (max-width: 600px) {
            .bbs-row {
                padding: 14px 16px;
            }
            .resource-title {
                font-size: 13.5px;
            }
            .direct-go-icon {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn" title="返回倉庫">⬅</a>
    <div class="search-wrapper">
        <input type="text" id="bbsSearch" class="search-input" placeholder="輸入關鍵字一秒檢索...">
    </div>
    <button class="theme-toggle" id="themeBtn">☀️</button>
</header>

<main class="category-main" style="padding-right: 20px; max-width: 900px;">
    <div class="bbs-container" id="bbsList"></div>
    <div class="loading-trigger" id="loadingTrigger">🔍 正在加載更多資源...</div>
</main>

<script src="../js/theme.js"></script>
<script src="../js/various_data.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof variousDatabase === 'undefined') {
            document.getElementById('bbsList').innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">⚠️ 未在 js/various_data.js 中找到數據庫！</div>';
            return;
        }

        // ---------- 新排序规则：没有年份的（合集）排在最前，有年份的按年份降序（新片在前） ----------
        function extractYear(title) {
            const match = title.match(/\b(19|20)\d{2}\b/);
            return match ? parseInt(match[0], 10) : 0;   // 0 表示无年份
        }

        const sortedDatabase = [...variousDatabase].sort((a, b) => {
            const yearA = extractYear(a.title);
            const yearB = extractYear(b.title);

            // 情况1：A 无年份 (0) 且 B 有年份 (>0) → A 排前
            if (yearA === 0 && yearB !== 0) return -1;
            // 情况2：A 有年份 (>0) 且 B 无年份 (0) → B 排前
            if (yearA !== 0 && yearB === 0) return 1;
            // 情况3：都有年份 → 按年份降序（大的在前）
            if (yearA !== 0 && yearB !== 0) return yearB - yearA;
            // 情况4：都无年份 → 保持原顺序（稳定排序）
            return 0;
        });

        let filteredData = [...sortedDatabase];
        const itemsPerPage = 25;
        let currentPage = 1;
        let isLoadingMore = false;

        const searchInput = document.getElementById('bbsSearch');
        const bbsList = document.getElementById('bbsList');
        const loadingTrigger = document.getElementById('loadingTrigger');

        function renderBbsPage(page, append = false) {
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);

            if (!append) bbsList.innerHTML = '';

            if (filteredData.length === 0) {
                bbsList.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">沒有找到相關資源 🥲</div>';
                loadingTrigger.style.display = 'none';
                return;
            }

            let html = '';
            pageData.forEach((item, idx) => {
                const globalIndex = start + idx;
                const colorClass = `color-${globalIndex % 5}`;
                html += `
                    <a href="${escapeHtml(item.link)}" class="bbs-row ${colorClass}" target="_blank" title="點擊直接開啟網盤下載">
                        <div class="resource-title">${escapeHtml(item.title)}</div>
                        <div class="direct-go-icon">🔗</div>
                    </a>
                `;
            });

            if (append) {
                bbsList.insertAdjacentHTML('beforeend', html);
            } else {
                bbsList.innerHTML = html;
            }

            if (end < filteredData.length) {
                loadingTrigger.style.display = 'block';
            } else {
                loadingTrigger.style.display = 'none';
            }
            isLoadingMore = false;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function searchResources() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (keyword === '') {
                filteredData = [...sortedDatabase];
            } else {
                filteredData = sortedDatabase.filter(item =>
                    item.title.toLowerCase().includes(keyword)
                );
            }
            currentPage = 1;
            isLoadingMore = false;
            renderBbsPage(currentPage, false);
        }

        window.addEventListener('scroll', () => {
            if (loadingTrigger.style.display === 'none') return;
            if (isLoadingMore) return;
            const rect = loadingTrigger.getBoundingClientRect();
            if (rect.top <= window.innerHeight + 100) {
                isLoadingMore = true;
                currentPage++;
                renderBbsPage(currentPage, true);
            }
        });

        searchInput.addEventListener('input', searchResources);
        renderBbsPage(currentPage, false);
    });
</script>

</footer>

<div class="sticky-bottom-bar" id="stickyBar">
    <div class="bar-content">
        <span class="bar-text">📢 获取最新更新资讯，点击关注微信公众号</span>
        <div class="desktop-qr-trigger">
            <span class="trigger-btn">👉 查看公众号二维码</span>
            <div class="desktop-qr-dropdown">
                <div class="qr-box">
                    <img src="../images/qrcode_mp.png" alt="微信公众号">
                    <p>关注微信公众号</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mobile-modal-overlay" id="mobileModal">
    <div class="mobile-modal-card">
        <button class="modal-close-btn" id="closeModalBtn">&times;</button>
        <h3>✨ 关注我们</h3>
        <p class="modal-subtitle">获取最新更新资讯，动态不再迷路</p>
        <div class="modal-qr-container">
            <div class="modal-qr-item">
                <img src="/images/qrcode_mp.png" alt="微信公众号">
                <span>微信公众号</span>
            </div>
        </div>
        <p class="modal-footer-tip">感谢你的陪伴与支持！</p>
    </div>
</div>

<script>
    (function() {
        const stickyBar = document.getElementById('stickyBar');
        const mobileModal = document.getElementById('mobileModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        if (stickyBar) {
            stickyBar.addEventListener('click', () => {
                if (window.innerWidth <= 600) {
                    mobileModal.classList.add('active');
                }
            });
        }

        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                mobileModal.classList.remove('active');
            });
        }

        if (mobileModal) {
            mobileModal.addEventListener('click', (e) => {
                if (e.target === mobileModal) {
                    mobileModal.classList.remove('active');
                }
            });
        }
    })();
</script>
</body>
</html>
