<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌手資料 - wc4° 音樂倉庫</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        /* 頁面頂部裝飾 */
        .artist-header { padding: 30px 24px; margin-bottom: 20px; border-radius: 28px; background: linear-gradient(145deg, rgba(14, 116, 144, 0.12), rgba(15, 23, 42, 0.06)); box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.12); }
        .artist-meta { display: grid; grid-template-columns: 140px auto; gap: 20px; align-items: center; justify-content: center; max-width: 760px; margin: 0 auto; }
        .artist-avatar-wrap { width: 140px; height: 140px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(148, 163, 184, 0.25); background: rgba(255,255,255,0.88); display: grid; place-items: center; position: relative; }
        .artist-avatar, .artist-avatar-placeholder { width: 100%; height: 100%; }
        .artist-avatar { object-fit: cover; display: none; }
        .artist-avatar-placeholder { display: grid; place-items: center; }
        .artist-name-wrap { display: grid; gap: 10px; }
        .artist-header h1 { font-size: 2.2rem; margin: 0; font-weight: 900; color: var(--text-color); }
        .artist-category { font-size: 0.95rem; color: #64748b; letter-spacing: 0.04em; }
        .album-tip { font-size: 14px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
        .album-note { font-size: 12px; color: #f87171; text-align: center; margin-bottom: 15px; }
        
        /* 專輯區塊樣式 */
        .group-section { margin-bottom: 60px; }
        .group-title { font-size: 1.3rem; margin-bottom: 25px; padding-left: 12px; border-left: 4px solid var(--primary); color: var(--text-color); font-weight: 700; }
        
        /* 專輯網格布局 */
        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 24px; }
        .album-card { display: block; text-decoration: none; color: inherit; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .album-card:hover { transform: translateY(-8px); }
        .album-cover { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border-color); object-fit: cover; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
        .album-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-year { font-size: 12px; color: #94a3b8; }
        
    </style>
</head>
<body>

<header>
    <a href="javascript:history.back()" class="back-btn" title="返回上一頁">⬅</a>
    <div class="search-wrapper"></div>
    <button class="theme-toggle" id="themeBtn">☀️</button>
</header>

<main class="category-main" style="max-width: 1000px; margin: 0 auto; padding: 0 20px;">
    <div class="artist-header">
        <div class="artist-meta">
            <div class="artist-avatar-wrap">
                <img id="artistAvatar" class="artist-avatar" src="" alt="artist avatar">
                <div id="artistAvatarPlaceholder" class="artist-avatar-placeholder myst-avatar">
                    <div class="fog"></div>
                    <div class="silhouette"></div>
                </div>
            </div>
            <div class="artist-name-wrap">
                <h1 id="artistName">載入中...</h1>
                <div id="artistCategory" class="artist-category"></div>
            </div>
        </div>
    </div>
    
    <div class="album-tip">点击封面跳转下载 / Click cover to download</div>
    <p class="album-note">
        部分敏感资源可能需要下载后修改文件后缀为 zip，解压密码为 8023 / Some files may require renaming to zip and using password 8023
    </p>

    <div id="detailContainer"></div>
</main>

<script src="js/theme.js"></script>
<script src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const artistId = params.get('id');

    if (!artistId) {
        document.body.innerHTML = '<div style="text-align:center;padding:50px;">錯誤：找不到歌手 ID</div>';
        return;
    }

    const artistRecord = musicDatabase.find(item => item.id === artistId);
    const avatarImg = document.getElementById('artistAvatar');
    const avatarPlaceholder = document.getElementById('artistAvatarPlaceholder');
    const categoryEl = document.getElementById('artistCategory');

    function setAvatar(src) {
        avatarImg.onload = () => {
            avatarImg.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
        };

        avatarImg.onerror = () => {
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'grid';
        };

        if (!src) {
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'grid';
            return;
        }

        avatarPlaceholder.style.display = 'grid';
        avatarImg.style.display = 'none';
        avatarImg.src = src;
    }

    if (artistRecord) {
        document.getElementById('artistName').innerText = artistRecord.name;
        categoryEl.innerText = artistRecord.category || '';
        setAvatar(artistRecord.avatar);
    }

    const jsonUrl = new URL(`artists/${artistId}.json`, window.location.href).href;
    fetch(jsonUrl)
        .then(res => {
            if (!res.ok) throw new Error('無法載入歌手數據');
            return res.json();
        })
        .then(data => {
            document.title = `${data.name} - wc4° 音樂倉庫`;
            document.getElementById('artistName').innerText = data.name;
            categoryEl.innerText = data.category || categoryEl.innerText;
            setAvatar(data.avatar || avatarImg.src);

            const container = document.getElementById('detailContainer');
            for (const [groupName, albums] of Object.entries(data.groups || {})) {
                const section = document.createElement('div');
                section.className = 'group-section';
                section.innerHTML = `<h2 class="group-title">${groupName}</h2>`;

                const grid = document.createElement('div');
                grid.className = 'album-grid';

                const sortedAlbums = Array.isArray(albums) ? [...albums].sort((a, b) => b.year - a.year) : [];

                sortedAlbums.forEach(item => {
                    const hasCover = item.cover && item.cover.trim() !== '';
                    const coverHtml = hasCover 
                        ? `<img src="${item.cover}" class="album-cover" onerror="this.outerHTML='<div class=\'album-cover vinyl-placeholder\'><div class=\'vinyl-center\'>🎵</div></div>'">`
                        : `<div class="album-cover vinyl-placeholder"><div class="vinyl-center">🎵</div></div>`;

                    grid.innerHTML += `
                        <a href="${item.link}" target="_blank" class="album-card" title="${item.title}">
                            ${coverHtml}
                            <div class="album-title">${item.title}</div>
                            <div class="album-year">${item.year}</div>
                        </a>`;
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        })
        .catch(err => {
            document.title = '歌手資料 - wc4° 音樂倉庫';
            document.getElementById('artistName').innerText = artistRecord ? artistRecord.name : '載入失敗';
            const container = document.getElementById('detailContainer');
            container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#f87171;">
                未找到專屬資料 JSON，請確認 artists/${artistId}.json 是否存在。若僅需展示專輯，該提示可忽略。
            </div>`;
        });
});
</script>
</body>
</html>
